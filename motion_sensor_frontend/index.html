<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MotionSense Sensor</title>
  <style>

    /* Matching clean light theme for the embedded sensor controls. */
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --border: #e5eaf2;
      --text: #172033;
      --muted: #778198;
      --primary: #4f46e5;
      --danger: #dc2626;
      --success: #087f5b;
    }
    body { padding: 8px 0; background: transparent; color: var(--text); }
    .sensor-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(25,42,70,.045);
    }
    .heading { font-size: 18px; font-weight: 750; letter-spacing: -.025em; margin-bottom: 6px; }
    .description { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    button { border: 0; border-radius: 11px; padding: 11px 17px; min-height: 44px; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    #start { background: var(--primary); color: #fff; box-shadow: 0 5px 12px rgba(79,70,229,.16); }
    #stop { background: #eef2f7; color: #344054; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    #status { margin-top: 14px; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--border); background: #f8fafc; color: var(--muted); overflow-wrap: anywhere; }
    #status.ok { color: var(--success); background: #ecfdf5; border-color: #bbf7d0; }
    #status.error { color: var(--danger); background: #fef2f2; border-color: #fecaca; }
    .small { margin-top: 11px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="sensor-card">
    <div class="heading">Live motion sensor</div>
    <div class="description">Use your phone and allow motion access when your browser asks.</div>
    <div class="controls">
      <button id="start" type="button">Start sensing</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <div id="status" role="status" aria-live="polite">Ready to start.</div>
    <div class="small">Keep this page open while activity is being detected.</div>
  </main>

  <script>
    (() => {
      "use strict";

      const startButton = document.getElementById("start");
      const stopButton = document.getElementById("stop");
      const statusBox = document.getElementById("status");

      let running = false;
      let motionSeen = false;
      let orientationSeen = false;
      let samples = [];
      let lastSentAt = 0;
      let noDataTimer = null;
      let renderArgs = {};

      function setStatus(message, kind = "") {
        statusBox.textContent = message;
        statusBox.className = kind;
      }

      function sendValue(value) {
        // Streamlit Components v1 communication protocol.
        window.parent.postMessage({
          type: "streamlit:setComponentValue",
          value,
          dataType: "json"
        }, "*");
      }

      function setFrameHeight() {
        window.parent.postMessage({
          type: "streamlit:setFrameHeight",
          height: document.documentElement.scrollHeight
        }, "*");
      }

      function numberOrZero(value) {
        return Number.isFinite(value) ? Number(value) : 0;
      }

      function onMotion(event) {
        if (!running) return;
        const accG = event.accelerationIncludingGravity || {};
        const acc = event.acceleration || {};
        const rotation = event.rotationRate || {};

        // Nine channels in this order:
        // [accelerationIncludingGravity x/y/z,
        //  acceleration x/y/z,
        //  rotationRate alpha/beta/gamma].
        // These channel definitions/order must match the live model's training data.
        const row = [
          numberOrZero(accG.x), numberOrZero(accG.y), numberOrZero(accG.z),
          numberOrZero(acc.x), numberOrZero(acc.y), numberOrZero(acc.z),
          numberOrZero(rotation.alpha), numberOrZero(rotation.beta), numberOrZero(rotation.gamma)
        ];

        // Some browsers fire the event but report no usable sensor values.
        const hasAnyMotionValue = [accG.x, accG.y, accG.z, acc.x, acc.y, acc.z,
          rotation.alpha, rotation.beta, rotation.gamma].some(Number.isFinite);
        if (!hasAnyMotionValue) return;

        motionSeen = true;
        samples.push(row);
        if (samples.length > 64) samples = samples.slice(-64);

        // Send rolling windows once at least 32 rows are available; then update
        // approximately every 32 sensor events to avoid excessive reruns.
        if (samples.length >= 32 && (samples.length === 32 || samples.length % 32 === 0)) {
          const now = Date.now();
          if (now - lastSentAt > 250) {
            lastSentAt = now;
            sendValue({status: "window", samples: samples.slice(-64)});
            setStatus("Sensor data received. Detecting activity…", "ok");
          }
        }
      }

      function onOrientation(event) {
        if (!running) return;
        if ([event.alpha, event.beta, event.gamma].some(Number.isFinite)) {
          orientationSeen = true;
        }
      }

      function onDeviceError() {
        if (!running) return;
        setStatus("The browser did not provide motion data. Check device/browser support and site permissions.", "error");
      }

      async function requestPermissionIfNeeded() {
        // iOS Safari requires a user gesture to request these permissions.
        const requests = [];
        if (typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function") {
          requests.push(DeviceMotionEvent.requestPermission());
        }
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          requests.push(DeviceOrientationEvent.requestPermission());
        }
        if (requests.length) {
          const results = await Promise.all(requests);
          if (results.some(result => result !== "granted")) {
            const err = new Error("Motion permission was not granted. Allow motion access in browser settings and try again.");
            err.permissionDenied = true;
            throw err;
          }
        }
      }

      async function start() {
        if (running) return;
        if (typeof window.DeviceMotionEvent === "undefined") {
          sendValue({status: "unsupported"});
          setStatus("This browser does not expose DeviceMotionEvent. Try Chrome on a compatible phone over HTTPS.", "error");
          return;
        }

        startButton.disabled = true;
        setStatus("Requesting motion sensor access…");
        try {
          await requestPermissionIfNeeded();
          running = true;
          motionSeen = false;
          orientationSeen = false;
          samples = [];
          lastSentAt = 0;

          window.addEventListener("devicemotion", onMotion, true);
          window.addEventListener("deviceorientation", onOrientation, true);
          window.addEventListener("error", onDeviceError);

          stopButton.disabled = false;
          sendValue({status: "started"});
          setStatus("Waiting for motion data… Move your phone gently.");
          noDataTimer = window.setTimeout(() => {
            if (running && !motionSeen) {
              setStatus(
                "No motion values received yet. Confirm you are on a phone, using HTTPS, and that motion access is allowed.",
                "error"
              );
              sendValue({status: "error", message: "No motion sensor data received. Check browser permissions, HTTPS, and device sensor support."});
            }
          }, 5000);
          setFrameHeight();
        } catch (error) {
          startButton.disabled = false;
          const denied = error && (error.permissionDenied ||
            error.name === "NotAllowedError" ||
            /permission|denied/i.test(error.message || ""));
          if (denied) {
            sendValue({status: "permission_denied"});
            setStatus(error.message || "Motion permission was denied. Allow it in browser settings and try again.", "error");
          } else {
            sendValue({status: "error", message: (error && error.message) || "Could not start motion sensing."});
            setStatus((error && error.message) || "Could not start motion sensing.", "error");
          }
        }
      }

      function stop() {
        if (noDataTimer !== null) window.clearTimeout(noDataTimer);
        noDataTimer = null;
        if (running) {
          window.removeEventListener("devicemotion", onMotion, true);
          window.removeEventListener("deviceorientation", onOrientation, true);
          window.removeEventListener("error", onDeviceError);
        }
        running = false;
        startButton.disabled = false;
        stopButton.disabled = true;
        samples = [];
        sendValue({status: "stopped"});
        setStatus("Sensor stopped.");
        setFrameHeight();
      }

      startButton.addEventListener("click", start);
      stopButton.addEventListener("click", stop);

      // Standard Streamlit Components v1 handshake and rerender support.
      window.addEventListener("message", event => {
        const data = event.data;
        if (!data || typeof data !== "object") return;
        if (data.type === "streamlit:render") {
          renderArgs = data.args || {};
          setFrameHeight();
        }
      });

      window.parent.postMessage({type: "streamlit:componentReady", apiVersion: 1}, "*");
      setFrameHeight();
    })();
  </script>
</body>
</html>
